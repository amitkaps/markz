# pnpm 12 reads project settings from here (moved out of .npmrc).

# The root is the markz package; `docs/` is the site, a private consumer of it.
packages:
  - docs
  - bench

# Dependencies allowed to run install scripts (native binaries, for the site).
allowBuilds:
  esbuild: true
  workerd: true

# Supply-chain cooldown, in minutes. 0 tracks the newest releases; a real
# project wants 1440+.
minimumReleaseAge: 0

# Collapse every `vite` in the tree onto Vite+'s core build.
# Bump this alongside the `vite-plus` devDependency.
overrides:
  'vite@*': 'npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0'
