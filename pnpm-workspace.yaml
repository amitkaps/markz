# @prose
# # pnpm's settings
#
# pnpm holds back a version for a day after it's published, so a bad release can be caught
# before it's installed. That default is kept, and our own packages skip the wait, since each
# reaches npm only after the owner approves it with 2FA. The scope, not a version, is named, so
# a release needs no change here.
minimumReleaseAgeExclude:
  - "@amitkaps/*"

# Collapse every `vite` in the tree onto Vite+'s core build.
# Bump this alongside the `vite-plus` devDependency.
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.1.0"

# Vite+'s Vite implementation is exposed through an npm alias, so
# pnpm cannot validate it against normal `vite` peer ranges.
peerDependencyRules:
  allowAny:
    - vite

# Dependencies allowed to run install scripts: wrangler's native binaries.
allowBuilds:
  esbuild: true
  workerd: true
