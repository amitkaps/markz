# @prose
# # pnpm's settings
#
# pnpm holds back a version for a while after it's published. prose is ours, so a new release of
# it can come in straight away. Drop the entry once that wait has passed.
minimumReleaseAgeExclude:
  - "@amitkaps/prose@0.4.0"

# Collapse every `vite` in the tree onto Vite+'s core build.
# Bump this alongside the `vite-plus` devDependency.
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.1.0"

# Vite+'s Vite implementation is exposed through an npm alias, so
# pnpm cannot validate it against normal `vite` peer ranges.
peerDependencyRules:
  allowAny:
    - vite

# Dependencies allowed to run install scripts: wrangler's native binaries.
allowBuilds:
  esbuild: true
  workerd: true
