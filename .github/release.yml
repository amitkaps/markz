# The headings of a release's generated notes, by the one label each pull request carries
# (AGENTS.md). Tests, tooling, site and lessons are `internal` and left out. A pull request with
# no label falls under Other, so a missed label shows instead of hiding.
changelog:
  exclude:
    labels:
      - internal
      - dependencies
  categories:
    - title: Breaking
      labels: [breaking]
    - title: Added
      labels: [added]
    - title: Fixed
      labels: [fixed]
    - title: Faster and smaller
      labels: [improved]
    - title: Documentation
      labels: [docs]
    - title: Other
      labels: ["*"]
