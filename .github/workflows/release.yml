name: release

# Push a `vX.Y.Z` tag → build, verify, stage the tarball on npm and attach it to a GitHub
# Release. npm trusts this workflow to stage (OIDC), so there is no npm token; a maintainer
# approves the staged version with 2FA to publish it. The same exchange signs the provenance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        run: |
          v="$(node -p 'require("./package.json").version')"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }

      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

      # `pnpm pack` runs `prepack` (the build) first, so the tarball never ships a stale dist/.
      - run: pnpm pack

      # Staged, not published: the version waits on npm until a maintainer approves it with 2FA
      # (`npm stage approve`), so a tag push alone can't put a version in front of users. The
      # tarball is the one just packed and checked, not a second build. A version with a
      # pre-release part (`-rc.0`) goes to the `next` dist-tag so it never becomes `latest`.
      - name: Stage on npm
        run: |
          tag=latest; case "$GITHUB_REF_NAME" in *-*) tag=next;; esac
          # The tag is a detached checkout holding the tarball, which pnpm's git checks refuse.
          pnpm stage publish ./amitkaps-markz-*.tgz --no-git-checks --provenance --access public --tag "$tag"

      # The notes are generated from the pull requests' labels (`.github/release.yml`). An annotated
      # tag's message, such as a breaking release's migration notes, goes above them. The checkout
      # keeps only the commit, so the tag is fetched again to read its message.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          fi
          gh release create "$GITHUB_REF_NAME" ./amitkaps-markz-*.tgz --title "$GITHUB_REF_NAME" \
            --generate-notes --notes "$notes"
