name: release

# Push a `vX.Y.Z` tag → build, verify, publish the tarball to npm and attach it to a GitHub
# Release. npm trusts this workflow as the package's publisher (OIDC), so there is no npm token;
# the same exchange signs the provenance statement.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        run: |
          v="$(node -p 'require("./package.json").version')"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }

      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

      # `pnpm pack` runs `prepack` (the build) first, so the tarball never ships a stale dist/.
      - run: pnpm pack

      # The tarball just packed and checked, not a second build. A version with a pre-release part
      # (`-rc.0`) goes to the `next` dist-tag so it never becomes `latest`.
      - name: Publish to npm
        run: |
          tag=latest; case "$GITHUB_REF_NAME" in *-*) tag=next;; esac
          npm publish ./amitkaps-markz-*.tgz --provenance --access public --tag "$tag"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./amitkaps-markz-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
