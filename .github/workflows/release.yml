name: release

# Push a `vX.Y.Z` tag → build, verify, and attach the installable tarball to a GitHub Release.
# Consumers install from the release asset URL until the package is published to npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        run: |
          v="$(node -p 'require("./package.json").version')"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }

      - run: pnpm run check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

      # `pnpm pack` runs `prepack` (the build) first, so the tarball never ships a stale dist/.
      - run: pnpm pack

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./amitkaps-markz-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
