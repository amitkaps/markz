name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same script Cloudflare runs before each deploy: check, test, build, then the site.
      - name: Verify (check, test, build, site)
        run: pnpm run verify

      # The package's `exports`, `files` and types, checked by publint against the packed tarball.
      # It's fetched for this step, not a dependency. arethetypeswrong was ruled out, since it
      # checks for old Node resolution that markz, ESM only on Node 24 and up, doesn't support.
      - name: Package (publint)
        run: pnpm dlx publint@0.3 --strict

      - name: Bundle size (20 KB gzip budget)
        run: pnpm size
