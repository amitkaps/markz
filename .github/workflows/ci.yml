name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check (format, lint, typecheck)
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The package's `exports`, `files` and types, checked by publint against the packed tarball.
      # It's fetched for this step, not a dependency. arethetypeswrong was ruled out, since it
      # checks for old Node resolution that markz, ESM only on Node 24 and up, doesn't support.
      - name: Package (publint)
        run: pnpm dlx publint@0.3 --strict

      - name: Bundle size (20 KB gzip budget)
        run: pnpm size

      # `--out .prose` is prose's next default; the installed 0.3.0 writes `.prose/site`. Drop it
      # once prose releases.
      - name: Site (prose build, then the Quality page)
        run: |
          pnpm prose build --out .prose
          pnpm quality

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the site
        run: |
          pnpm prose build --out .prose
          pnpm quality

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
