name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check (format, lint, typecheck)
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle size (20 KB gzip budget)
        run: pnpm size

      # Every benchmark adapter once, timing nothing, so the benchmark can't rot unseen.
      - name: Benchmark smoke
        run: pnpm --filter markz-bench smoke

      # The site renders the repo's Markdown with this commit's markz, so a parser change that
      # breaks a page fails here.
      - name: Site check (format, lint, typecheck, svelte)
        run: pnpm --filter markz-docs check

      - name: Site tests
        run: pnpm --filter markz-docs test

      - name: Site build (prerender, Cloudflare adapter)
        run: pnpm --filter markz-docs build

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm --filter markz-docs build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy
