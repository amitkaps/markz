name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check (format, lint, typecheck)
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The package's `exports`, `files` and types, checked by publint against the packed tarball.
      # It's fetched for this step, not a dependency. arethetypeswrong was ruled out, since it
      # checks for old Node resolution that markz, ESM only on Node 24 and up, doesn't support.
      - name: Package (publint)
        run: pnpm dlx publint@0.3 --strict

      - name: Bundle size (20 KB gzip budget)
        run: pnpm size

      - name: Site (prose build, then the Quality page)
        run: |
          pnpm prose build
          pnpm quality
