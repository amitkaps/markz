# @prose
# # How the site is deployed
#
# The site is static files on a Cloudflare Worker, with no code. `prose build` writes the pages
# into `.prose`, and `pnpm quality` adds the Quality page beside them.
#
# Cloudflare builds and deploys it from `main` on every merge, and `wrangler deploy` reads this
# file. Its build and deploy commands are set on the Worker in the dashboard
# ([development](docs/development.md#the-site)). The custom domain is set here, and needs the
# `amitkaps.com` zone on the same account.

name = "markz"
compatibility_date = "2026-09-09"
workers_dev = true
routes = [{ pattern = "markz.amitkaps.com", custom_domain = true }]

[assets]
directory = ".prose"
# Serve the site's own 404.html for any missing address.
not_found_handling = "404-page"
# Serve /src/html.ts from src/html.ts.html, with no redirect.
html_handling = "auto-trailing-slash"
